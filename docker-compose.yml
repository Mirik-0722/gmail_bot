services:
  bot:
    build: .
    image: gmail-bot
    container_name: gmail-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Baza volume ichida saqlanadi, konteyner qayta yaratilsa ham yo'qolmaydi
      DB_PATH: /data/gmail_bot.db
    volumes:
      - bot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
